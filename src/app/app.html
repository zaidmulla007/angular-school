<style>
  :host {
    display: flex;
    min-height: 100vh;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }

  .app-layout {
    display: flex;
    width: 100%;
    min-height: 100vh;
    position: relative;
  }

  .main-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    transition: margin-left 0.3s ease;
  }

  .page-content {
    flex: 1;
    overflow-y: auto;
  }
</style>

<div class="app-layout">
  <!-- Notification System -->
  <app-notification></app-notification>
  
  <!-- Navigation Sidebar -->
  <app-navigation></app-navigation>
  
  <!-- Main Content Area -->
  <div class="main-content">
    <div class="page-content">
      <!-- Dashboard Component (Default View) -->
      <app-dashboard *ngIf="currentView === 'dashboard'"></app-dashboard>
      
      <!-- Students Component -->
      <app-students *ngIf="currentView === 'students'"></app-students>
      
      <!-- Teachers Component -->
      <app-teachers *ngIf="currentView === 'teachers'"></app-teachers>
      
      <!-- Courses Component -->
      <app-courses *ngIf="currentView === 'classes'"></app-courses>
      
      <!-- User List Component -->
      <app-user-list *ngIf="currentView === 'users'"></app-user-list>
      
      <!-- Router Outlet for additional routes -->
      <router-outlet></router-outlet>
    </div>
  </div>
</div>
